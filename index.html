<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couple Houses</title>
<style>
:root{
  --bg:#faf5ef; --panel:#fffdfa; --panel2:#f6efe6;
  --ink:#2e2723; --muted:#8a7d73; --line:#e8ddd1;
  --accent:#d94f78; --accent-ink:#fff; --accent-soft:#fdeaf0;
  --gold:#c98a2e; --gold-soft:#fbf0da; --ok:#3f8f66; --ok-soft:#e4f3ea;
  --shadow:0 1px 2px rgba(60,40,30,.06), 0 8px 24px rgba(60,40,30,.07);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161210; --panel:#221b17; --panel2:#2b221c;
    --ink:#f3ebe3; --muted:#a5978d; --line:#362b24;
    --accent:#ff7fa3; --accent-ink:#2a0d18; --accent-soft:#3b2029;
    --gold:#e8b665; --gold-soft:#3a2d19; --ok:#6cc496; --ok-soft:#1f3529;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#161210; --panel:#221b17; --panel2:#2b221c;
  --ink:#f3ebe3; --muted:#a5978d; --line:#362b24;
  --accent:#ff7fa3; --accent-ink:#2a0d18; --accent-soft:#3b2029;
  --gold:#e8b665; --gold-soft:#3a2d19; --ok:#6cc496; --ok-soft:#1f3529;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;flex:none}
.top h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.top .sub{margin:1px 0 0;font-size:12px;color:var(--muted)}
.purse{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;white-space:nowrap}

/* generic */
.wrap{padding:14px 16px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
h2.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 4px 9px;font-weight:700}
h2.sec:first-child{margin-top:4px}
.title{font-size:16px;font-weight:700;margin:0 0 3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);transition:transform .08s ease, filter .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.wide{width:100%;display:block}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;
  background:var(--panel2);border:1px solid var(--line)}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.love{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;line-height:1.15}
.stat span{font-size:11px;color:var(--muted)}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;padding:6px 0 5px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* house */
.roomtabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.roomtabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.roomtabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.roomtabs button.locked{color:var(--muted)}
.floor{display:grid;gap:2px;background:var(--floor-bg,#f0e4d6);border-radius:14px;padding:7px;border:1px solid var(--line);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35), var(--shadow);touch-action:manipulation}
.tile{background:rgba(255,255,255,.42);border-radius:6px;aspect-ratio:1/1;min-height:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{background:rgba(255,255,255,.07)}}
:root[data-theme="dark"] .tile{background:rgba(255,255,255,.07)}
.floor.placing .tile{outline:1px dashed rgba(0,0,0,.18);cursor:pointer}
.item{display:grid;place-items:center;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  font-size:clamp(15px,5.4vw,26px);line-height:1;cursor:pointer;box-shadow:0 1px 2px rgba(60,40,30,.12);overflow:hidden}
.item.ro{cursor:default}
.held{position:sticky;bottom:84px;z-index:15;background:var(--accent);color:var(--accent-ink);border-radius:14px;
  padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);margin-top:10px}
.held .btn{background:rgba(255,255,255,.22);border-color:transparent;color:var(--accent-ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.shelf .slot{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)}
.shelf .slot .g{font-size:24px;line-height:1.25}
.shelf .slot .n{font-size:11px;font-weight:700;margin-top:1px}
.shelf .slot .p{font-size:11px;color:var(--muted)}
.shelf .slot button{margin-top:6px;width:100%}
.cat{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px}
.cat button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.cat button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:transparent}

/* games */
.gamecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.gamecard .g{font-size:27px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border-radius:13px;flex:none}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;font-weight:600;width:100%}
.opt[data-state="pick"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt[data-state="right"]{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.opt[data-state="wrong"]{border-color:transparent;background:var(--panel2);color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mcard{aspect-ratio:1/1;border-radius:13px;border:1px solid var(--line);background:var(--panel2);font-size:26px;
  display:grid;place-items:center;transition:transform .15s ease}
.mcard[data-up="1"]{background:var(--panel);transform:rotateY(0)}
.mcard[data-done="1"]{background:var(--ok-soft);border-color:transparent}
.mcard span{opacity:0}
.mcard[data-up="1"] span,.mcard[data-done="1"] span{opacity:1}
.checks{display:grid;gap:9px;margin-top:11px}
.check{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;width:100%;text-align:left;font-weight:700}
.check .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px}
.check[data-on="1"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.check[data-on="1"] .box{border-color:currentColor}

/* showcase */
.hcard{position:relative;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:0;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.hcard .thumb{height:104px;display:flex;align-items:flex-end;gap:3px;padding:9px 11px;font-size:23px;background:var(--panel2)}
.hcard .meta{padding:11px 13px}
.hcard .rank{position:absolute;top:9px;left:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800}
.notice{background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.center{text-align:center}
.hero{text-align:center;padding:26px 8px 8px}
.hero .big{font-size:44px}
.hero h2{margin:8px 0 4px;font-size:21px}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:13.5px}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="screen" class="wrap"></div>
</div>
<nav class="nav" id="nav" hidden><div class="nav-in">
  <button data-tab="home"><i>🏡</i>Home</button>
  <button data-tab="play"><i>🎲</i>Play</button>
  <button data-tab="build"><i>🛠</i>Build</button>
  <button data-tab="show"><i>🌍</i>Showcase</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>

  { id:"firepit",  name:"Fire Pit",     glyph:"🔥", price:220, charm:11, w:1, h:1, room:"garden" },

const ITEM_BY_ID = Object.fromEntries(CATALOGUE.map(i => [i.id, i]));

/* {A} is replaced with the answering partner's name */
const QUESTIONS = [
  { q:"Friday night, {A} gets to pick. What happens?", o:["Couch and takeaway","Dinner out","Friends over","Early night"] },
  { q:"{A}'s ideal holiday is...", o:["Beach and nothing","A big city","Hiking somewhere cold","Road trip"] },

  { q:"{A}'s reaction to a surprise party?", o:["Loves it","Hates it","Fake loves it","Cries"] },
  { q:"Which room matters most to {A}?", o:["Kitchen","Bedroom","Living room","Outside"] },

  { q:"{A}'s worst habit, admitted?", o:["Being late","Interrupting","Leaving cups everywhere","Doomscrolling"] },

  { q:"{A} decorates the house in...", o:["Warm and cosy","Clean and minimal","Colour everywhere","Plants everywhere"] },
  { q:"How does {A} handle a bad day?", o:["Talk about it","Distraction","Sleep","Food"] },
  { q:"What does {A} think you do best?", o:["Listen","Make them laugh","Look after them","Push them"] },
];

/* Seeded neighbours so the showcase is not an empty room on day one */
const SEED_HOUSES = [
  { id:"seed-1", name:"The Tan House", partners:"Mai and Ollie", since:"2019-03-02", likes:412, tagline:"Six years, one very loud kettle.",
    placed:[["sofa","living",0,1],["tv","living",3,0],["books","living",5,2],["fireplc","living",0,3],["plant","living",2,2],["photos","living",4,3],["heartst","living",5,0]] },
  { id:"seed-2", name:"Flat 9B", partners:"Dee and Sam", since:"2022-11-18", likes:188, tagline:"Small flat, big plans.",

/* ---------------- STORE ----------------
   The only place that talks to persistence. Swap LocalStore for a
   SupabaseStore implementing these four methods and nothing else changes. */
const LocalStore = {
  async load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      return migrate(JSON.parse(raw));
    }catch(err){ console.warn("load failed, starting fresh", err); return null; }
  },
  async save(state){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
    catch(err){ console.warn("save failed, session is memory only", err); return false; }
  },
  async listShowcase(state){
    const mine = state && state.showcase.published ? [ownHouseCard(state)] : [];
    const seeds = SEED_HOUSES.map(h => ({
      id:h.id, name:h.name, partners:h.partners, since:h.since, tagline:h.tagline,
      likes:h.likes, mine:false, placed:h.placed.map(p => ({ itemId:p[0], room:p[1], x:p[2], y:p[3], rot:0 })),
    }));
    return [...mine, ...seeds].map(h => ({ ...h, charm:charmOf(h.placed) }))
      .sort((a,b) => b.charm - a.charm);
  },
  async likeHouse(state, houseId){
    const given = state.showcase.likesGiven;
    const at = given.indexOf(houseId);
    if(at >= 0) given.splice(at,1); else given.push(houseId);
    await this.save(state);
    return at < 0;
  },
};
const Store = LocalStore;

function migrate(s){
  if(!s || typeof s !== "object") return null;
  if(!s.schemaVersion) s.schemaVersion = SCHEMA_VERSION;
  // future shape changes land here, version by version
  return s;
}

function earn(amount, why){
  state.wallet.hearts += amount;
  state.wallet.lifetimeEarned += amount;
  save();
  toast(`+${amount} ♥  ${why}`);

function spend(amount){
  if(state.wallet.hearts < amount) return false;
  state.wallet.hearts -= amount;
  save();
  return true;
}
function charmOf(placed){
  return (placed || []).reduce((sum,p) => sum + ((ITEM_BY_ID[p.itemId] || {}).charm || 0), 0);
}
function daysTogether(since){
  if(!since) return 0;
  const ms = Date.now() - new Date(since + "T00:00:00").getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}
function ownHouseCard(s){
  return {
    id:"mine", name:s.couple.name, partners:`${s.couple.partnerA} and ${s.couple.partnerB}`,
    since:s.couple.togetherSince, tagline:s.showcase.tagline || "Still building.",

}

/* ---------------- HOUSE ----------------
   renderHouse is the seam. A Sims style animated renderer replaces this
   one function plus its CSS and touches nothing else in the app. */
function footprint(item, rot){
  return rot % 2 === 0 ? { w:item.w, h:item.h } : { w:item.h, h:item.w };
}
function canPlace(placed, roomId, x, y, w, h, ignoreId){
  const room = ROOM_BY_ID[roomId];
  if(x < 0 || y < 0 || x + w > room.w || y + h > room.h) return false;
  return !placed.some(p => {
    if(p.room !== roomId || p.instanceId === ignoreId) return false;
    const f = footprint(ITEM_BY_ID[p.itemId], p.rot);
    return x < p.x + f.w && x + w > p.x && y < p.y + f.h && y + h > p.y;
  });
}
function renderHouse(container, house, roomId, opts){
  opts = opts || {};
  const room = ROOM_BY_ID[roomId];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches
    && document.documentElement.getAttribute("data-theme") !== "light";
  const floor = document.createElement("div");
  floor.className = "floor" + (opts.placing ? " placing" : "");
  floor.style.setProperty("--floor-bg", dark ? room.darkFloor : room.floor);
  floor.style.gridTemplateColumns = `repeat(${room.w}, 1fr)`;
  floor.style.gridTemplateRows = `repeat(${room.h}, 1fr)`;

  for(let y = 0; y < room.h; y++){
    for(let x = 0; x < room.w; x++){
      const t = document.createElement("div");
      t.className = "tile";
      t.style.gridColumn = String(x + 1);
      t.style.gridRow = String(y + 1);
      if(opts.onTile) t.onclick = () => opts.onTile(x, y);
      floor.appendChild(t);
    }
  }
  (house.placed || []).filter(p => p.room === roomId).forEach(p => {
    const item = ITEM_BY_ID[p.itemId];
    if(!item) return;
    const f = footprint(item, p.rot);
    const el = document.createElement("div");
    el.className = "item" + (opts.onItem ? "" : " ro");
    el.textContent = item.glyph;
    el.title = item.name;
    el.style.gridColumn = `${p.x + 1} / span ${f.w}`;
    el.style.gridRow = `${p.y + 1} / span ${f.h}`;
    if(opts.onItem) el.onclick = e => { e.stopPropagation(); opts.onItem(p); };
    floor.appendChild(el);
  });
  container.appendChild(floor);
  return floor;
}

/* ---------------- UI HELPERS ---------------- */
const $ = sel => document.querySelector(sel);
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  // a template with several roots comes back as a fragment, so callers can
  // append one block; query it before appending, a fragment empties on insert
  return t.content.children.length > 1 ? t.content : t.content.firstElementChild;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1900);
}
function go(tab, view){
  route = { tab, view: view || null };
  window.scrollTo(0,0);
  render();
}

/* ---------------- GAMES ---------------- */
function currentStreak(){
  const last = state.streak.lastCheckIn;
  if(!last) return 0;
  const yest = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  return (last === today() || last === yest) ? state.streak.count : 0;
}
function rollCheckinDay(){
  const d = today();
  if(state.streak.day !== d){ state.streak.day = d; state.streak.a = false; state.streak.b = false; }
}
function maybeCompleteCheckin(){
  const d = today();
  if(state.streak.lastCheckIn === d) return;
  if(!(state.streak.a && state.streak.b)) return;
  const yest = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  state.streak.count = state.streak.lastCheckIn === yest ? state.streak.count + 1 : 1;
  state.streak.lastCheckIn = d;
  const bonus = Math.min(BALANCE.streakBonus * state.streak.count, BALANCE.streakBonusCap);
  state.stats.gamesPlayed++;
  earn(BALANCE.checkInBase + bonus, `day ${state.streak.count} together`);
}

      const guessName = g.answerer === "A" ? state.couple.partnerB : state.couple.partnerA;

      if(g.phase === "answer" || g.phase === "guess"){
        const q = g.qs[g.i];
        const who = g.phase === "answer" ? askName : guessName;
        const prompt = g.phase === "answer"
          ? q.q.replace("{A}", askName)
          : `${askName}'s answer to: ${q.q.replace("{A}", askName)}`;
        root.appendChild(el(`
          <div class="card">
            <div class="spread"><span class="pill love">${esc(who)}</span>

        const opts = root.querySelector(".opts");
        q.o.forEach((text, idx) => {

          b.onclick = () => {
            (g.phase === "answer" ? g.answers : g.guesses).push(idx);
            g.i++;

          const hit = g.guesses[i] === g.answers[i];

              hit ? "" : `, guessed <span class="muted">${esc(q.o[g.guesses[i]])}</span>`}</p></div>`));
        });
        root.appendChild(list);
        const again = el(`<button class="btn primary wide">Play again</button>`);
        again.onclick = () => { activeGame = null; render(); };
        root.appendChild(again);

      let reward = matches * BALANCE.duelPerMatch;
      if(matches === g.qs.length) reward += BALANCE.duelSweepBonus;
      state.stats.duelsPlayed++;
      state.stats.gamesPlayed++;
      state.stats.bestDuel = Math.max(state.stats.bestDuel, matches);
      if(reward > 0) earn(reward, "trivia duel"); else save();

  memory: {
    id:"memory", title:"Memory Match", glyph:"🧩",

          <div class="mgrid"></div>
        </div>`));
      const grid = root.querySelector(".mgrid");
      g.cards.forEach((c, i) => {
        const b = el(`<button class="mcard" data-up="${c.up ? 1 : 0}" data-done="${c.done ? 1 : 0}"><span>${c.icon}</span></button>`);
        b.onclick = () => this.flip(i);
        grid.appendChild(b);
      });
      if(g.finished){
        root.appendChild(el(`<div class="card center"><p class="title">${g.reward} ♥ earned in ${g.moves} moves</p></div>`));
        const again = el(`<button class="btn primary wide">Play again</button>`);
        again.onclick = () => { activeGame = null; render(); };
        root.appendChild(again);
      }
    },
    start(){
      const icons = ["🌹","🍰","🎬","🏖️","🐣","🎈","🍕","🎧","🚲","🌙","☕","🧩"]
        .sort(() => Math.random() - 0.5).slice(0, BALANCE.memoryPairs);
      const cards = [...icons, ...icons].map(icon => ({ icon, up:false, done:false }))
        .sort(() => Math.random() - 0.5);
      activeGame = { type:"memory", cards, first:null, moves:0, matched:0, lock:false, finished:false, reward:0 };
    },
    flip(i){
      const g = activeGame;
      const c = g.cards[i];
      if(g.lock || g.finished || c.up || c.done) return;
      c.up = true;
      if(g.first === null){ g.first = i; render(); return; }
      g.moves++;
      const a = g.cards[g.first];
      if(a.icon === c.icon){
        a.done = c.done = true; a.up = c.up = false;
        g.first = null;
        g.matched++;
        if(g.matched === BALANCE.memoryPairs){
          g.finished = true;
          const over = Math.max(0, g.moves - BALANCE.memoryParMoves);
          g.reward = Math.max(BALANCE.memoryMin, BALANCE.memoryMax - over * BALANCE.memoryStepPenalty);
          state.stats.gamesPlayed++;
          earn(g.reward, "memory match");
        }
        render();
        return;
      }
      g.lock = true;
      render();
      setTimeout(() => {
        a.up = false; c.up = false; g.first = null; g.lock = false; render();
      }, 750);
    },
  },
};

  ROOMS.forEach(r => {
    const open = state.house.rooms[r.id].unlocked;
    const b = el(`<button class="${open ? "" : "locked"}" aria-current="${activeRoom === r.id && open}">
      ${open ? esc(r.name) : "🔒 " + esc(r.name) + " · " + r.price + "♥"}</button>`);
    b.onclick = () => {
      if(open){ activeRoom = r.id; shopFilter = r.id; render(); return; }
      if(state.wallet.hearts < r.price) return toast(`Need ${r.price - state.wallet.hearts} more ♥`);
      if(!confirm(`Unlock the ${r.name} for ${r.price} ♥?`)) return;
      spend(r.price);
      state.house.rooms[r.id].unlocked = true;
      activeRoom = r.id; shopFilter = r.id;
      save(); toast(`${r.name} unlocked`); render();
    };
    tabs.appendChild(b);
  });
  root.appendChild(tabs);

  if(!state.house.rooms[activeRoom].unlocked) activeRoom = "living";

  const houseCard = el(`<div class="card"></div>`);
  renderHouse(houseCard, state.house, activeRoom, {
    placing: !!held,
    onTile(x, y){
      if(!held) return toast("Pick something from below first");
      const item = ITEM_BY_ID[held.itemId];
      const f = footprint(item, held.rot);
      if(!canPlace(state.house.placed, activeRoom, x, y, f.w, f.h)) return toast("Does not fit there");
      state.house.placed.push({ instanceId:held.instanceId, itemId:held.itemId, room:activeRoom, x, y, rot:held.rot });
      held = null;
      save(); render();
    },
    onItem(p){
      if(held) return toast("Put down what you are holding first");
      state.house.placed = state.house.placed.filter(q => q.instanceId !== p.instanceId);
      held = { instanceId:p.instanceId, itemId:p.itemId, rot:p.rot, fromPlaced:true };
      save(); render();
    },
  });
  houseCard.appendChild(el(`<p class="tiny muted center" style="margin:9px 0 0">
    Tap a piece to pick it up · tap a tile to put it down</p>`));
  root.appendChild(houseCard);

  if(held){
    const item = ITEM_BY_ID[held.itemId];
    const bar = el(`<div class="held">
      <span style="font-size:22px">${item.glyph}</span>
      <b style="flex:1">${esc(item.name)}</b>
      ${item.w !== item.h ? '<button class="btn sm" id="rot">Rotate</button>' : ""}
      <button class="btn sm" id="stow">Store</button></div>`);
    const rot = bar.querySelector("#rot");
    if(rot) rot.onclick = () => { held.rot = (held.rot + 1) % 2; render(); };
    bar.querySelector("#stow").onclick = () => {
      state.house.inventory.push({ instanceId:held.instanceId, itemId:held.itemId });
      held = null; save(); render();
    };
    root.appendChild(bar);
  }

  // storage
  root.appendChild(el(`<h2 class="sec">In storage (${state.house.inventory.length})</h2>`));
  if(state.house.inventory.length === 0){
    root.appendChild(el(`<div class="empty">Nothing in storage. Buy something below.</div>`));
  }else{
    const shelf = el(`<div class="shelf"></div>`);
    state.house.inventory.forEach(inv => {
      const item = ITEM_BY_ID[inv.itemId];
      const slot = el(`<div class="slot"><div class="g">${item.glyph}</div>
        <div class="n">${esc(item.name)}</div><div class="p">${item.charm} charm</div>
        <button class="btn sm">Place</button></div>`);
      slot.querySelector("button").onclick = () => {
        if(held) return toast("Put down what you are holding first");
        state.house.inventory = state.house.inventory.filter(q => q.instanceId !== inv.instanceId);
        held = { instanceId:inv.instanceId, itemId:inv.itemId, rot:0, fromPlaced:false };
        save(); render();
      };
      shelf.appendChild(slot);
    });
    root.appendChild(shelf);
  }

  // shop
  root.appendChild(el(`<h2 class="sec">Shop</h2>`));
  const cats = el(`<div class="cat"></div>`);
  [...ROOMS.map(r => ({ id:r.id, name:r.name })), { id:"any", name:"Mementos" }].forEach(c => {
    const b = el(`<button aria-current="${shopFilter === c.id}">${esc(c.name)}</button>`);
    b.onclick = () => { shopFilter = c.id; render(); };
    cats.appendChild(b);
  });
  root.appendChild(cats);

  const shelf = el(`<div class="shelf"></div>`);
  CATALOGUE.filter(i => i.room === shopFilter).forEach(item => {
    const afford = state.wallet.hearts >= item.price;
    const slot = el(`<div class="slot"><div class="g">${item.glyph}</div>
      <div class="n">${esc(item.name)}</div><div class="p">${item.charm} charm</div>
      <button class="btn sm ${afford ? "primary" : ""}" ${afford ? "" : "disabled"}>${item.price} ♥</button></div>`);
    slot.querySelector("button").onclick = () => {
      if(!spend(item.price)) return toast("Not enough hearts");
      state.house.inventory.push({ instanceId:uid(), itemId:item.id });
      save(); toast(`${item.name} delivered`); render();
    };
    shelf.appendChild(slot);
  });
  root.appendChild(shelf);
}

function thumbFor(placed){
  return [...placed]
    .sort((a,b) => (ITEM_BY_ID[b.itemId].charm || 0) - (ITEM_BY_ID[a.itemId].charm || 0))
    .slice(0, 7).map(p => ITEM_BY_ID[p.itemId].glyph).join(" ") || "🏚️";
}

async function screenShowcase(root){
  if(route.view && route.view.house){
    const h = route.view.house;
    const back = el(`<button class="btn ghost sm" style="margin-bottom:12px">← Back to the street</button>`);
    back.onclick = () => go("show");
    root.appendChild(back);
    const liked = state.showcase.likesGiven.includes(h.id);
    root.appendChild(el(`<div class="card">
      <p class="title">${esc(h.name)}</p>
      <p class="small muted">${esc(h.partners)} · ${daysTogether(h.since).toLocaleString()} days together</p>
      <p class="small" style="margin:8px 0 0">"${esc(h.tagline)}"</p></div>`));
    const houseCard = el(`<div class="card"></div>`);
    renderHouse(houseCard, h, "living", {});
    houseCard.appendChild(el(`<div class="spread" style="margin-top:11px">
      <span class="pill gold">✨ ${h.charm} charm</span>
      <span class="pill love">♥ ${(h.likes + (liked ? 1 : 0)).toLocaleString()}</span></div>`));
    root.appendChild(houseCard);
    if(!h.mine){
      const b = el(`<button class="btn ${liked ? "" : "primary"} wide">${liked ? "♥ Loved" : "Leave a heart"}</button>`);
      b.onclick = async () => { await Store.likeHouse(state, h.id); render(); };
      root.appendChild(b);
    }
    return;
  }

  root.appendChild(el(`<div class="notice">This street is a local preview. Real couples appear here once the app goes online.</div>`));

  if(!state.showcase.published){
    const card = el(`<div class="card">
      <p class="title">Your house is private</p>
      <p class="small muted">Publish it and it joins the street, ranked by charm.</p>
      <label class="field" style="margin-top:11px"><span>One line about you two</span>
        <input id="tag" maxlength="60" placeholder="Two years in, still buying chairs."></label>
      <button class="btn primary wide" id="pub">Publish our house</button></div>`);
    card.querySelector("#pub").onclick = async () => {
      state.showcase.tagline = card.querySelector("#tag").value.trim();
      state.showcase.published = true;
      await save(); toast("You are on the street"); render();
    };
    root.appendChild(card);
  }

  const houses = await Store.listShowcase(state);
  root.appendChild(el(`<h2 class="sec">Ranked by charm</h2>`));
  houses.forEach((h, i) => {
    const liked = state.showcase.likesGiven.includes(h.id);
    const card = el(`<button class="hcard">
      <div class="thumb">${thumbFor(h.placed)}</div>
      <div class="rank">#${i + 1}${h.mine ? " · yours" : ""}</div>
      <div class="meta">
        <div class="spread"><p class="title" style="margin:0">${esc(h.name)}</p>
          <span class="pill gold">✨ ${h.charm}</span></div>
        <p class="small muted" style="margin:3px 0 0">${esc(h.partners)} · ${daysTogether(h.since).toLocaleString()} days</p>
        <p class="small" style="margin:6px 0 0">"${esc(h.tagline)}" <span class="muted">· ♥ ${(h.likes + (liked ? 1 : 0)).toLocaleString()}</span></p>
      </div></button>`);
    card.onclick = () => go("show", { house:h });
    root.appendChild(card);
  });
}

/* ---------------- BOOT ---------------- */
async function render(){
  renderTop();
  const root = $("#screen");
  root.innerHTML = "";
  const nav = $("#nav");
  if(!state){ nav.hidden = true; screenSetup(root); return; }
  nav.hidden = false;
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.tab === route.tab)));
  if(route.tab === "home") screenHome(root);
  else if(route.tab === "play") screenPlay(root);
  else if(route.tab === "build") screenBuild(root);
  else await screenShowcase(root);
}

$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if(!b) return;
  if(b.dataset.tab === "play") activeGame = null;
  go(b.dataset.tab);
});

(async function boot(){
  state = await Store.load();
  render();
})();
</script>
</body>
</html>
