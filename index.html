<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap">
<style>
/* NEST :: interface, art bible section 13.
   One rounded geometric sans, two weights. Cards on cream, no borders,
   no strokes. Panels never cover the dome. */
:root{
  --cream:#FBF3E7; --oat:#EFE1CD; --sand:#DCC7A8; --clay:#C4A78B; --cocoa:#8A6E58; --ink:#4A4038;
  --blush:#F5C9C6; --peach:#F7C9A3; --butter:#F6E3A8; --sage:#BFD6B4; --mist:#B9D3DC; --lilac:#CFC2E0;
  --coral:#F2735F; --marigold:#F2A33C; --teal:#2F7A73; --plum:#7A4A6B;
  --card:rgba(251,243,231,.92);
  --shadow:0 8px 24px rgba(74,64,56,.12);
  --r:20px;
  --sheet:45vh; --tabs:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:linear-gradient(180deg,#EAF0F2 0%,#FBF3E7 100%);
  color:var(--ink);
  font:400 15px/1.5 Quicksand, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

/* ---- the dome ---- */
#stage{position:fixed;top:0;left:0;right:0;height:calc(100vh - var(--sheet) - var(--tabs));overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.post{position:fixed;top:0;left:0;right:0;height:calc(100vh - var(--sheet) - var(--tabs));pointer-events:none}
#bloom{background:radial-gradient(ellipse at 28% 16%, rgba(255,241,214,.16), transparent 54%);mix-blend-mode:screen}
#vignette{background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(74,64,56,.20) 100%)}
#grade{background:rgba(247,201,163,.07);mix-blend-mode:multiply}

#bar{position:fixed;top:0;left:0;right:0;z-index:6;padding:14px 18px 0}
.barin{display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto}
.brand{margin:0;font-weight:700;font-size:19px;letter-spacing:.16em}
.purse{margin-left:auto;background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;
  box-shadow:var(--shadow);min-height:44px;display:flex;align-items:center}
.purse::before{content:"";width:11px;height:11px;border-radius:3px 11px 11px 11px;background:var(--coral);
  transform:rotate(45deg);margin-right:9px}

#tools{position:fixed;z-index:6;right:14px;top:calc(100vh - var(--sheet) - var(--tabs) - 62px);display:flex;gap:9px}
#tools button{width:48px;height:48px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  font-weight:700;font-size:13px;display:grid;place-items:center;color:var(--cocoa)}

/* ---- the sheet, never taller than 45 percent ---- */
#sheet{position:fixed;left:0;right:0;bottom:var(--tabs);height:var(--sheet);z-index:8;
  background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(74,64,56,.14);
  padding:16px 16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet::before{content:"";display:block;width:44px;height:5px;border-radius:99px;background:var(--sand);
  margin:-6px auto 12px}
#sheet>*{max-width:520px;margin-left:auto;margin-right:auto}

#tabs{position:fixed;left:0;right:0;bottom:0;height:var(--tabs);z-index:9;background:var(--cream);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px calc(env(safe-area-inset-bottom))}
#tabs button{min-height:48px;border-radius:14px;font-weight:700;font-size:13px;color:var(--clay)}
#tabs button[aria-current="true"]{color:var(--ink);background:var(--oat)}

/* ---- pieces ---- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.mid{text-align:center}
.h{margin:0;font-weight:700;font-size:16px}
.s{margin:2px 0 0;font-size:13.5px}
.dim{color:var(--cocoa)}
.mid{text-align:center}
.big{margin:4px 0;font-size:34px;font-weight:700;line-height:1.1}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);margin:16px 4px 8px}
.note{background:var(--butter);border-radius:14px;padding:11px 14px;font-size:12.5px;font-weight:700;color:var(--cocoa);margin:0 0 12px}
.good{color:var(--teal)} .miss{color:var(--clay)}
.line{padding:9px 0}
.line+.line{border-top:1px solid var(--oat)}

.btn{background:var(--oat);border-radius:14px;padding:13px 18px;font-weight:700;min-height:48px;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.96)}
.btn.go{background:var(--coral);color:var(--cream);width:100%;display:block}
.btn.sm{padding:9px 14px;min-height:44px;font-size:13px;border-radius:12px}
.btn.back{background:none;color:var(--cocoa);padding:4px 0 12px;min-height:36px}
.btn.back::before{content:"‹  "}
.btn:disabled{opacity:.4}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin:0 -4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--oat);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;
  color:var(--cocoa);min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}
.chip.warm{background:var(--blush);color:var(--ink)}
.chip[aria-current="true"]{background:var(--ink);color:var(--cream)}
.chip.locked{opacity:.62}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:13px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11.5px;color:var(--cocoa)}

.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:11px;min-height:48px}
.row img{width:54px;height:54px;flex:none}

.strip{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px 6px 10px;text-align:center;
  min-width:96px;flex:none;min-height:48px}
.tile img{width:100%;aspect-ratio:1/1;object-fit:contain}
.tile span{display:block;font-size:11.5px;font-weight:700;line-height:1.25}
.tile em{display:block;font-style:normal;font-size:11px;color:var(--clay)}
.tile .btn{margin-top:7px;width:100%;padding:8px 4px}

.held{position:sticky;top:-4px;z-index:3;display:flex;align-items:center;gap:10px;background:var(--coral);
  color:var(--cream);border-radius:16px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.held img{width:40px;height:40px;flex:none}
.held b{flex:1;font-size:14px}
.held .s{opacity:.8;font-size:12px}
.held .btn{background:rgba(251,243,231,.24);color:var(--cream)}

.checks{display:grid;gap:9px;margin-top:12px}
.check{display:flex;align-items:center;gap:12px;background:var(--oat);border-radius:14px;padding:13px;
  font-weight:700;min-height:48px}
.check .tick{width:26px;height:26px;border-radius:9px;background:var(--cream);display:grid;place-items:center;
  color:var(--teal);flex:none}
.check[data-on="1"]{background:var(--sage)}

.bar{height:6px;background:var(--oat);border-radius:99px;overflow:hidden;margin:12px 0 2px}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .3s cubic-bezier(.34,1.4,.64,1)}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{text-align:left;background:var(--oat);border-radius:14px;padding:14px;font-weight:700;width:100%;min-height:48px}
.opt:active{background:var(--blush)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mcard{aspect-ratio:1/1;border-radius:14px;background:var(--oat);display:grid;place-items:center;padding:4px;
  transition:background .2s ease}
.mcard[data-up="1"]{background:var(--cream)}
.mcard[data-done="1"]{background:var(--sage)}
.mcard img{width:100%;height:100%;object-fit:contain}

.hcard{position:relative;display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;padding:0}
.hcard img{width:100%;aspect-ratio:2/1;height:auto;object-fit:cover;background:var(--oat)}
.hcard .meta{padding:12px 14px 14px}
.hcard .rank{position:absolute;top:10px;left:12px;background:var(--card);border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:700}

.f{display:block;margin:12px 0}
.f span{display:block;font-size:12px;font-weight:700;color:var(--cocoa);margin-bottom:6px}
.f input{width:100%;padding:13px;border-radius:14px;border:0;background:var(--oat);color:var(--ink);
  font:inherit;min-height:48px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet) + var(--tabs) + 14px);
  z-index:20;background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:999px;font-weight:700;
  font-size:13px;opacity:0;transition:opacity .25s ease, transform .25s cubic-bezier(.34,1.4,.64,1);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}

#dev{position:fixed;inset:0;z-index:40;background:var(--cream);overflow-y:auto;padding:18px}
.devhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.devlist{display:grid;gap:8px}
.devrow{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow)}
.devrow img{width:44px;height:44px;flex:none;background:var(--oat);border-radius:10px}
.devrow.bad{background:var(--blush)}

/* ---- onboarding, spec sections 4 and 5 ---- */
#splash{position:fixed;inset:0;z-index:90;background:var(--cream);display:grid;place-items:center;
  font-weight:700;font-size:22px;letter-spacing:.34em;color:var(--cocoa);
  transition:opacity 320ms ease;pointer-events:none}
#splash.gone{opacity:0}

body.onboarding #stage,body.onboarding .post{height:100vh}
body.onboarding #sheet,body.onboarding #tabs,body.onboarding #bar,body.onboarding #tools{display:none}

/* the layer never eats a tap meant for the dome: only its own controls do */
#onboard{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;
  justify-content:space-between;pointer-events:none}
#ob-sheet{pointer-events:auto}
.ob-tap{position:fixed;inset:0;pointer-events:auto}
#ob-top{padding:calc(20px + env(safe-area-inset-top)) 22px 0;pointer-events:none}
#ob-top button,#ob-top .ob-tourbar{pointer-events:auto}
#ob-sheet{max-height:45vh;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
#ob-sheet:empty{display:none}
#ob-sheet>*{max-width:520px;margin:0 auto}

.ob-beat{min-height:120px}
.ob-line{position:relative;z-index:1;margin:0;font-size:24px;font-weight:700;line-height:1.25;max-width:15ch;text-wrap:balance;
  text-shadow:0 1px 18px rgba(251,243,231,.9),0 1px 3px rgba(251,243,231,.9)}
.ob-skip{z-index:2;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));opacity:.6;
  font-weight:700;font-size:14px;color:var(--cocoa);min-height:48px;padding:0 12px}
.ob-tourbar{display:inline-block;background:var(--card);border-radius:999px;padding:9px 16px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow)}

.ob-card{background:var(--card);border-radius:26px 26px var(--r) var(--r);box-shadow:0 -8px 30px rgba(74,64,56,.14);
  padding:18px 18px 16px;margin-top:12px}
.ob-card.ob-thin{padding:14px}
.ob-h{margin:0 0 4px;font-size:20px;font-weight:700;text-wrap:balance}
.ob-auth{display:grid;gap:9px;margin:14px 0 10px}
.ob-auth .btn{width:100%;display:block}
.ob-prov{background:var(--oat)}
.ob-apple{background:var(--ink);color:var(--cream)}
.ob-legal{font-size:12px;color:var(--cocoa);margin:6px 0 0;line-height:1.5}
.ob-legal a{color:var(--cocoa)}
.ob-quiet{display:block;width:100%;margin-top:12px;min-height:48px;font-weight:700;font-size:14px;color:var(--cocoa)}
.ob-stack{display:grid;gap:10px;margin:14px 0 10px}
.ob-stack .btn{width:100%;display:block}
.ob-row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.ob-row2 .btn{width:100%}
.ob-sim{background:var(--butter);color:var(--cocoa);border-radius:12px;padding:10px 12px;
  font-size:12px;font-weight:600;margin:10px 0 0;line-height:1.5}
.ob-err{background:var(--blush);color:var(--ink);border-radius:12px;padding:10px 12px;
  font-size:13px;font-weight:700;margin-top:10px}

.ob-code{display:flex;justify-content:center;gap:6px;margin:16px 0 14px}
.ob-code b{background:var(--oat);border-radius:12px;width:44px;height:56px;display:grid;place-items:center;
  font-size:24px;font-weight:700;box-shadow:inset 0 -2px 0 rgba(74,64,56,.08)}
.ob-boxes{display:flex;justify-content:center;gap:7px;margin:14px 0 4px}
.ob-box{width:46px;height:56px;border:0;border-radius:12px;background:var(--oat);text-align:center;
  font:700 22px Quicksand,system-ui,sans-serif;color:var(--ink);text-transform:uppercase}
.ob-box:focus{outline:3px solid var(--coral);outline-offset:2px}

.ob-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0}
.ob-sw{height:46px;border-radius:14px;display:grid;align-items:end;justify-items:center;padding-bottom:6px;
  box-shadow:var(--shadow)}
.ob-sw span{font-size:11px;font-weight:700;color:var(--ink);background:var(--card);border-radius:999px;padding:2px 8px}
.ob-sw[aria-current="true"]{outline:3px solid var(--coral);outline-offset:2px}

.ob-pulse{width:44px;height:44px;border-radius:99px;background:var(--coral);margin:16px auto 4px;
  animation:obpulse 1.6s ease-in-out infinite}
@keyframes obpulse{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1);opacity:1}}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
@media (min-height:900px){ :root{ --sheet:42vh } }
</style>
</head>
<body>
<div id="splash"><span>N E S T</span></div>
<div id="stage"></div>
<div class="post" id="bloom"></div>
<div class="post" id="grade"></div>
<div class="post" id="vignette"></div>

<header id="bar" hidden></header>
<div id="tools" hidden>
  <button id="rot-l" title="Turn left">⟲</button>
  <button id="rot-r" title="Turn right">⟳</button>
  <button id="zoom" title="Zoom">home</button>
  <button id="devbtn" title="Asset review, section 16">QA</button>
  <button id="funbtn" title="Onboarding funnel">%</button>
</div>

<div id="onboard" hidden>
  <div id="ob-top"></div>
  <div id="ob-sheet"></div>
</div>

<main id="sheet"></main>
<nav id="tabs" hidden>
  <button data-tab="home">Home</button>
  <button data-tab="play">Play</button>
  <button data-tab="build">Build</button>
  <button data-tab="show">Street</button>
</nav>
<div id="toast"></div>
<div id="dev" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="src/api.js"></script>
<script src="src/analytics.js"></script>
<script src="src/palette.js"></script>
<script src="src/props.js"></script>
<script src="src/diorama.js"></script>
<script src="src/bible.js"></script>
<script src="src/games.js"></script>
<script src="src/app.js"></script>
<script src="src/onboarding.js"></script>
</body>
</html>
